name: temp-mujoco-runtime

on:
  push:
    branches:
      - tmp-mujoco-runtime-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-wheel:
    runs-on: ubuntu-24.04
    steps:
      - name: Download official MuJoCo CPython 3.13 Linux wheel
        shell: bash
        run: |
          set -euo pipefail
          FILE='mujoco-3.12.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl'
          URL='https://files.pythonhosted.org/packages/d2/3d/04d24602d8d73f6eb108be06a04a3e6c8198a83f17de97ae0fc766980ac8/mujoco-3.12.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl'
          curl --fail --location --retry 4 --retry-all-errors --output "$FILE" "$URL"
          test -s "$FILE"
          sha256sum "$FILE" | tee SHA256SUMS.txt
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: mujoco-3.12.0-cp313-linux-wheel
          path: |
            mujoco-3.12.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
