name: temp-mujoco-runtime

on:
  push:
    branches:
      - tmp-mujoco-runtime-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-render-deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download MuJoCo rendering dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir wheels
          python -m pip download --only-binary=:all: --dest wheels PyOpenGL==3.1.10 glfw==2.10.0
          sha256sum wheels/* | tee SHA256SUMS.txt
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: mujoco-render-deps-cp313
          path: |
            wheels/*
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
